<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Caldamere</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="brand"><span class="brand-dot"></span> Caldamere</a>
      <ul class="nav-list">
        <li><a href="/series/">Series</a></li>
        <li><a href="/what-we-do.html">What we do</a></li>
        <li><a href="/company.html">Company</a></li>
      </ul>
      <div class="nav-cta">
        <a href="/series/tournaments.html" class="btn btn-primary">View tournaments</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <p class="hero-label">Contact</p>
        <h1>Get in touch.</h1>
        <p>Inquiries regarding series operations and Caldamere projects.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="form-box">
          <form action="#" method="POST">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
              <label for="msg">Message</label>
              <textarea id="msg" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send message</button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/main.js"></script>
</body>
</html>
